services:
  web:
    image: python:3.11-slim
    working_dir: /site
    volumes:
      - ./:/site:ro
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0", "--directory", "/site"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3000/', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
